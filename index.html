<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerCompare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        Career<span>Compare</span>
    </div>
</header>

<main>

    <section class="hero">

        <h1>
            Compare Your <span>Future</span>
        </h1>

        <p>
            Explore careers, compare salaries, and see what your future could look like.
        </p>

        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="Search careers..."
            >

            <button onclick="searchCareers()">
                Search
            </button>

        </div>

    </section>

    <h2 class="section-title">
        Popular Careers
    </h2>

    <section
        id="careerList"
        class="careers">
    </section>

</main>

<footer>
    CareerCompare — Explore. Compare. Plan your future.
</footer>

<script src="app.js"></script>

</body>
</html>
